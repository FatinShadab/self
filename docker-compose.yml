services:
  self:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./workspace
        target: /home/entity
        read_only: false
    # Default bridge networking is intentional: internet access is available
    # without host networking, privileged mode, or extra capabilities.
    networks:
      - default

  eval:
    profiles: ["eval"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./workspace
        target: /home/entity
        read_only: true
      - type: bind
        source: ./eval
        target: /opt/eval
        read_only: false
      - type: bind
        source: ./docker-compose.yml
        target: /opt/eval-compose.yml
        read_only: true
    entrypoint: ["python", "-m", "eval.runner"]

